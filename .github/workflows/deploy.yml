name: Deploy pages
on:
  # Позволяет запускать workflow вручную из вкладки Actions
  workflow_dispatch:
  # Запускает workflow при пуше в ветку main
  push:
    branches: [main]
# Разрешения, необходимые для деплоя на GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
# Гарантирует, что одновременно будет выполняться только один деплой
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - name: Setup @antfu/ni
        run: npm i -g @antfu/ni
      - name: Install dependencies
        run: nci
      - name: Build
        # Флаг --base обязателен для корректной работы на GitHub Pages
        run: nr build --base /${{github.event.repository.name}}/
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
