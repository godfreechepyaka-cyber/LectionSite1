name: Build and Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install root deps
        run: pnpm install

      - name: Build Slidev presentations
        run: pnpm build:slides

      - name: Install Quartz deps
        working-directory: quartz
        run: pnpm install

      - name: Prepare Quartz content
        run: |
          rm -rf quartz/content/vault
          mkdir -p quartz/content/vault
          rsync -av \
            --exclude='.obsidian' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='slides' \
            --exclude='quartz' \
            --exclude='dist' \
            --exclude='public' \
            --exclude='.gitignore' \
            --exclude='package.json' \
            --exclude='pnpm-lock.yaml' \
            --exclude='pnpm-workspace.yaml' \
            --exclude='.npmrc' \
            "$GITHUB_WORKSPACE/" quartz/content/vault/

      - name: Build Quartz
        working-directory: quartz
        run: npx quartz build

      - name: Copy Slidev builds into Quartz public
        run: |
          for dir in slides/*/; do
            name=$(basename "$dir")
            if [ -d "$dir/dist" ]; then
              mkdir -p "quartz/public/slides/$name"
              cp -r "$dir/dist/"* "quartz/public/slides/$name/"
            fi
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: quartz/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
